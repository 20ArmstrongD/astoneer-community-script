name: offline-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - name: Shell syntax and lint
        run: |
          bash -n install.sh install/astroneer-install.sh install/repair.sh scripts/astroneer scripts/entrypoint-observer.sh
          shellcheck -x install.sh install/astroneer-install.sh install/repair.sh scripts/astroneer scripts/entrypoint-observer.sh
          shfmt -d -i 2 install.sh install/astroneer-install.sh install/repair.sh scripts/astroneer scripts/entrypoint-observer.sh
      - name: Python syntax and offline tests
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -v
      - name: Installer help
        run: bash install.sh --help
